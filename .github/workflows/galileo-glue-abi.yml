name: Galileo glue ABI

on:
  push:
    branches: ["galileo-glue-abi-140"]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      rust_version: "1.85.0"
      verify_artifacts: false

  stage-release-assets:
    name: Verify and stage Galileo release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify archive ABI and release matrix
        run: >-
          python3 mozjs-sys/etc/verify_galileo_glue_archives.py
          --require-release-matrix release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: galileo-mozjs-glue-release-assets
          path: release-assets/libmozjs-*.tar.gz
          if-no-files-found: error
